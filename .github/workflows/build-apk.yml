name: Gerar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Configurar Java 21 (Exigido pelo Capacitor/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Instalar dependências e compilar Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 5. Configurar Capacitor e criar projeto Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -f capacitor.config.ts
          printf '{\n  "appId": "com.leandrocorrea.docscan",\n  "appName": "DocScan Pro",\n  "webDir": "dist"\n}\n' > capacitor.config.json
          npx cap add android

      - name: 6. Configurar permissões e corrigir conflito Kotlin
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          cat << 'EOF' >> android/build.gradle
          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: 7. Compilar o arquivo APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: DocScan-Pro-LeandroCorrea
          path: android/app/build/outputs/apk/debug/app-debug.apk
